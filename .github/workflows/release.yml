# tag v* 触发:全量校验 → 打包 zip → GitHub Release。
# 若仓库配置了商店密钥(EXTENSION_ID/CLIENT_ID/CLIENT_SECRET/REFRESH_TOKEN),
# 自动提交 Chrome Web Store(版本号来自 package.json,与 tag 同步)。
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - name: verify tag matches package.json
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF_NAME#v}
          if [ "$PKG" != "$TAG" ]; then
            echo "version mismatch: package.json=$PKG tag=$TAG"
            exit 1
          fi
      - run: pnpm build
      - run: pnpm package
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/chrome-mv3-prod.zip
          name: v${{ github.ref_name }}
          generate_release_notes: true

  submit-store:
    # 没配 EXTENSION_ID 密钥时整 job 跳过(step if 也能兜,双保险)
    runs-on: ubuntu-latest
    needs: release
    env:
      EXTENSION_ID: ${{ secrets.EXTENSION_ID }}
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
      REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm package
      - name: Submit to Chrome Web Store
        uses: browser-market/bpp@v2
        if: env.EXTENSION_ID != ''