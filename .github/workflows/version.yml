# PR 合并到 main 后自动升版本:pkg.json 无变化(版本已是最新)→ 基线打 tag;
# tag 已存在 → 按提交类型 bump 并打 tag。bump 提交带 [skip ci] 防自我触发。
name: Version

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: compute version
        run: node scripts/ci-version.mjs
      - name: commit bump and tag
        run: |
          V=$(node -p "require('./package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- package.json; then
            git add package.json
            git commit -m "chore(release): bump version to $V [skip ci]"
          fi
          if ! git tag -l "v$V" | grep -q .; then
            git tag "v$V"
            git push origin HEAD:main --tags
          else
            echo "tag v$V already exists, nothing to push"
          fi